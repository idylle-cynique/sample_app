name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.13"
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run Minitest
        run: bin/rails test

      - name: Run RSpec
        run: bundle exec rspec
